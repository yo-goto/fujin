[package]
name = "fujin"
version = "0.1.0"
edition = "2021"
description = "A zellij sidebar plugin that visualizes AI agent status across panes and lets you jump to them"
license = "MIT"
repository = "https://github.com/yo-goto/fujin"
keywords = ["zellij", "terminal", "multiplexer", "tui", "ai-agent"]
categories = ["wasm", "development-tools", "visualization"]

[dependencies]
unicode-width = "0.2.2"
zellij-tile = "0.44.3"

[dev-dependencies]
# golden file（snapshot testing）。上流の zellij も同じ 1.48 系を5クレートで
# dev-dependency に置いている（.docs/issues/issue-ui-requirements-approach.md の層2）
insta = "1.48"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
# プラグイン内の panic はサイドバーごと落として復旧手段がなくなるため、
# 握り潰さず Option/Result として扱う
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
opt-level = "z"
lto = true
strip = true
